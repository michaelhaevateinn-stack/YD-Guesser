<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b12f40"><title>YD Guesser v0.5.3</title><link rel="stylesheet" href="style.css"></head><body><header><strong>YD <span>Guesser</span></strong><small>ポケモンをあてよう！</small></header><main><div class="top"><span id="status">ポケモンを選んでいます…</span><div class="top-actions"><button id="settingsButton" type="button" aria-label="設定を開く">⚙ 設定</button><button id="next" type="button">次の問題 ↻</button></div></div><p id="settingSummary" class="setting-summary"></p><p class="intro">好きなヒントをタップして開こう！</p><div id="hints" class="hints"></div><form id="answerForm"><label for="answer">わかったら答えよう！</label><div class="answer-row"><div class="answer-entry"><input id="answer" placeholder="例：リザードン" autocomplete="off" aria-label="ポケモン名" required><div id="suggestions" class="suggestions" hidden></div></div><button type="submit">回答！</button></div></form><p id="feedback" aria-live="polite"></p><section id="reveal" hidden><h2>せいかい！ 🎉</h2><img id="pokemonImage" alt="正解のポケモン"><p id="pokemonName"></p></section><p class="footnote">v0.5.3：進化の段階を図で表示。Z-A新メガ48フォルムを出題候補に追加。未収録の特性・画像は確認中です。通信が必要です。</p></main><dialog id="settingsDialog" aria-labelledby="settingsTitle"><form id="settingsForm" class="settings-form"><div class="settings-head"><h2 id="settingsTitle">⚙ 出題設定</h2><button type="button" id="closeSettings" aria-label="閉じる">✕</button></div><fieldset><legend>出題範囲</legend><label class="option"><input type="radio" name="scope" value="all"> 全世代から出題</label><label class="option"><input type="radio" name="scope" value="custom"> 初登場作品を選ぶ</label><p class="settings-note">初登場した作品で分類します。Z-Aの新メガシンカも選べます。</p><div id="generationChoices" class="generation-choices"></div></fieldset><fieldset><legend>進化しぼり</legend><label class="option"><input type="radio" name="evolutionFilter" value="all"> すべてのポケモン</label><label class="option"><input type="radio" name="evolutionFilter" value="final"> 最終進化のみ（進化しないポケモンも含む）</label></fieldset><p id="settingsError" class="settings-error" role="alert"></p><button class="save-settings" type="submit">設定を保存して次の問題へ</button></form></dialog><script src="app.js" defer></script></body></html>
